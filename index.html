<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💛 Flores Amarillas en el Espacio 💛</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    width: 100vw;
    touch-action: none;
  }

  #intro {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #1a0a00 0%, #000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1.2s ease, visibility 1.2s;
  }

  #intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-icon {
    font-size: 100px;
    animation: bounce 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 25px #ffdd55);
  }

  .intro-text {
    margin-top: 25px;
    color: #ffe566;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 700;
    text-align: center;
    text-shadow: 0 0 15px #ffcc00, 0 0 30px #ff9900;
    letter-spacing: 1px;
    animation: glow 2s ease-in-out infinite alternate;
    padding: 0 20px;
  }

  .tap-hint {
    position: absolute;
    bottom: 55px;
    color: #ffcc6688;
    font-size: 15px;
    animation: pulse 1.8s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-16px) scale(1.05); }
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900; }
    to   { text-shadow: 0 0 25px #ffe566, 0 0 45px #ffaa00, 0 0 70px #ff6600; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  #main {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  #main.show {
    opacity: 1;
  }

  #canvas3d {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .main-title {
    position: absolute;
    top: 22px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffe566;
    font-size: clamp(16px, 4.8vw, 23px);
    font-weight: 800;
    text-shadow: 0 0 12px #ffcc00, 0 0 25px #ff8800;
    z-index: 20;
    pointer-events: none;
  }

  .subtitle {
    position: absolute;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffcc88;
    font-size: 13px;
    opacity: 0.9;
    z-index: 20;
    pointer-events: none;
  }

  .hint-3d {
    position: absolute;
    bottom: 52px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffcc6688;
    font-size: 12px;
    z-index: 20;
    pointer-events: none;
    animation: pulse 2.5s infinite;
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-icon">🌻💛🌻</div>
  <div class="intro-text">¡FELIZ DÍA DE<br>LA PRIMAVERA MI AMOR!</div>
  <div class="tap-hint">Toca para entrar al espacio ✨</div>
</div>

<!-- MAIN 3D -->
<div id="main">
  <canvas id="canvas3d"></canvas>
  <div class="main-title">💛 ¡FELIZ DÍA DE LA PRIMAVERA MAMIORR! 💛</div>
  <div class="hint-3d">Arrastra para girar la galaxia</div>
  <div class="subtitle">Para mi noviecita hermosa • 21 de septiembre</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const phrases = [
    "Eres mi Sol ☀️", "Mi Girasol 🌻", "Te Amo 💛", "Mi Primavera",
    "Mi Mundo Entero", "Mis Flores Amarillas", "Brillas más que el Sol",
    "Mi Amor Infinito", "Hermosa", "Mi Todo", "Eres mi luz", "Te Ailoviu", 
    "Te quiero mucho", "Mi razón de sonreír", "Siempre contigo", "Mi flor favorita",
   "Assavakkit", "ndimakukondani", "sin jaalladha", "munsmawa", "Ich liebe dich",
  ];

  // ========== INTRO ==========
  const intro = document.getElementById('intro');
  const main = document.getElementById('main');

  function startExperience() {
    intro.classList.add('hide');
    setTimeout(() => {
      main.classList.add('show');
      init3D();
    }, 700);
  }

  intro.addEventListener('click', startExperience);
  intro.addEventListener('touchstart', startExperience, { passive: true });
  setTimeout(() => {
    if (!intro.classList.contains('hide')) startExperience();
  }, 4200);

  // ========== THREE.JS ==========
  let scene, camera, renderer;
  let galaxyGroup;
  let flowerPoints, starPoints, flowerMaterial;
  let textSprites = [];

  let isDragging = false;
  let previousTouch = { x: 0, y: 0 };
  let rotationY = 0;
  let rotationX = 0.22;
  let targetRotationY = 0;
  let targetRotationX = 0.22;
  let autoRotate = true;

  function init3D() {
    const canvas = document.getElementById('canvas3d');
    const width = window.innerWidth;
    const height = window.innerHeight;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0015);

    camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 2500);
    camera.position.set(0, 35, 175);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000);

    galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    const ambient = new THREE.AmbientLight(0x221100, 0.55);
    scene.add(ambient);
    const pointLight = new THREE.PointLight(0xffcc44, 2.0, 450);
    pointLight.position.set(0, 0, 0);
    galaxyGroup.add(pointLight);

    // Textura de flor mejorada (con alpha limpio)
    const flowerTexture = createFlowerTexture();

    createFlowerStars(flowerTexture);
    createCentralFlower();
    createTextSprites();

    setupControls(canvas);
    window.addEventListener('resize', onResize);

    animate();
  }

  // ---------- Textura de florecita AMARILLA con transparencia limpia ----------
  function createFlowerTexture(premultiply = true) {
    const size = 128; // más resolución para que no se vean cuadradas de cerca
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    // Fondo completamente transparente
    ctx.clearRect(0, 0, size, size);

    const cx = size / 2;
    const cy = size / 2;

    // Pétalos (8)
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Pétalo suave
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, -22, 0, -38);
      ctx.quadraticCurveTo(-14, -22, 0, 0);
      ctx.fillStyle = '#ffcc33';
      ctx.globalAlpha = 0.95;
      ctx.fill();

      // Brillo del pétalo
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(8, -18, 0, -32);
      ctx.quadraticCurveTo(-8, -18, 0, 0);
      ctx.fillStyle = '#ffe566';
      ctx.globalAlpha = 0.7;
      ctx.fill();

      ctx.restore();
    }

    // Centro de la flor
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe566';
    ctx.globalAlpha = 1;
    ctx.fill();

    // Centro más oscuro
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9900';
    ctx.fill();

    // Glow suave alrededor (para que no se vea el borde cuadrado)
    const grd = ctx.createRadialGradient(cx, cy, 8, cx, cy, 55);
    grd.addColorStop(0, 'rgba(255, 220, 80, 0.0)');
    grd.addColorStop(0.6, 'rgba(255, 180, 40, 0.15)');
    grd.addColorStop(1, 'rgba(255, 150, 0, 0)');
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, size, size);

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    tex.premultiplyAlpha = premultiply;
    return tex;
  }

  // ---------- Estrellas = florecitas ----------
  function createFlowerStars(texture) {
    const count = 1600;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      const r = 220 + Math.random() * 1000;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      positions[i*3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3 + 2] = r * Math.cos(phi);

      // tonos amarillos cálidos
      colors[i*3]     = 1.0;
      colors[i*3 + 1] = 0.78 + Math.random() * 0.18;
      colors[i*3 + 2] = 0.25 + Math.random() * 0.25;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 7.5,
      map: texture,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      alphaTest: 0.15,          // ← esto elimina los cuadrados
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });

    starPoints = new THREE.Points(geo, mat);
    scene.add(starPoints);
  }

  // ---------- Flor central: las "estrellas" cercanas ahora son flores amarillas ----------
  // Cada punto se dibuja como una florecita con tamaño y rotación propios (shader personalizado)
  function createCentralFlower() {
    const count = 900;
    const coreCount = 160;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const rotations = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      let x, y, z, size;

      if (i < count - coreCount) {
        // flores en los pétalos de la galaxia
        const petal = Math.floor(Math.random() * 8);
        const petalAngle = (petal / 8) * Math.PI * 2;
        const t = Math.random();
        const radius = 12 + t * 58 + Math.sin(t * 14) * 9;
        const angle = petalAngle + (Math.random() - 0.5) * 0.65 + t * 0.35;
        const height = (Math.random() - 0.5) * 16 * (1 - t * 0.7);

        x = Math.cos(angle) * radius;
        y = height;
        z = Math.sin(angle) * radius;
        size = 6 + Math.random() * 7;
      } else {
        // flores más pequeñas y brillantes en el centro
        const r = Math.random() * 11;
        const a = Math.random() * Math.PI * 2;
        x = Math.cos(a) * r;
        y = (Math.random() - 0.5) * 7;
        z = Math.sin(a) * r;
        size = 4 + Math.random() * 4;
      }

      positions[i*3]     = x;
      positions[i*3 + 1] = y;
      positions[i*3 + 2] = z;

      // leve variación de tono (la textura ya es amarilla)
      colors[i*3]     = 1.0;
      colors[i*3 + 1] = 0.9 + Math.random() * 0.1;
      colors[i*3 + 2] = 0.7 + Math.random() * 0.3;

      sizes[i] = size;
      rotations[i] = Math.random() * Math.PI * 2;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geo.setAttribute('aRot', new THREE.BufferAttribute(rotations, 1));

    flowerMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: createFlowerTexture(false) },
        uScale: { value: (window.innerHeight * renderer.getPixelRatio()) / 2 },
        uTime: { value: 0 }
      },
      vertexShader: `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aRot;
        uniform float uScale;
        uniform float uTime;
        varying vec3 vColor;
        varying float vRot;
        void main() {
          vColor = aColor;
          vRot = aRot + uTime * 0.15;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float pulse = 1.0 + 0.10 * sin(uTime * 1.6 + aRot * 5.0);
          gl_PointSize = aSize * pulse * (uScale / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        varying vec3 vColor;
        varying float vRot;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float c = cos(vRot);
          float s = sin(vRot);
          uv = mat2(c, -s, s, c) * uv + 0.5;
          vec4 tex = texture2D(map, uv);
          if (tex.a < 0.03) discard;
          gl_FragColor = vec4(tex.rgb * vColor, tex.a * 0.96);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    flowerPoints = new THREE.Points(geo, flowerMaterial);
    galaxyGroup.add(flowerPoints);
  }

  // ---------- Textos 3D ----------
  function createTextSprites() {
    phrases.forEach((text, i) => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 42px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff9900';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffe566';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;

      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        opacity: 0.92,
        depthTest: false
      });

      const sprite = new THREE.Sprite(material);
      sprite.scale.set(48, 12, 1);

      const phi = Math.acos(-1 + (2 * i) / phrases.length);
      const theta = Math.sqrt(phrases.length * Math.PI) * phi;
      const radius = 75 + Math.random() * 35;

      sprite.position.set(
        radius * Math.cos(theta) * Math.sin(phi),
        radius * Math.cos(phi) * 0.7,
        radius * Math.sin(theta) * Math.sin(phi)
      );

      galaxyGroup.add(sprite);
      textSprites.push(sprite);
    });
  }

  // ---------- Controles ----------
  function setupControls(canvas) {
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDragging = true;
        autoRotate = false;
        previousTouch.x = e.touches[0].clientX;
        previousTouch.y = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (!isDragging || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - previousTouch.x;
      const dy = t.clientY - previousTouch.y;

      targetRotationY += dx * 0.005;
      targetRotationX += dy * 0.004;
      targetRotationX = Math.max(-0.75, Math.min(0.85, targetRotationX));

      previousTouch.x = t.clientX;
      previousTouch.y = t.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
      setTimeout(() => { if (!isDragging) autoRotate = true; }, 4500);
    });

    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      autoRotate = false;
      previousTouch.x = e.clientX;
      previousTouch.y = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - previousTouch.x;
      const dy = e.clientY - previousTouch.y;
      targetRotationY += dx * 0.005;
      targetRotationX += dy * 0.004;
      targetRotationX = Math.max(-0.75, Math.min(0.85, targetRotationX));
      previousTouch.x = e.clientX;
      previousTouch.y = e.clientY;
    });
    window.addEventListener('mouseup', () => {
      isDragging = false;
      setTimeout(() => { if (!isDragging) autoRotate = true; }, 4500);
    });
  }

  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (flowerMaterial) {
      flowerMaterial.uniforms.uScale.value = (h * renderer.getPixelRatio()) / 2;
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    rotationY += (targetRotationY - rotationY) * 0.08;
    rotationX += (targetRotationX - rotationX) * 0.08;

    if (autoRotate) targetRotationY += 0.0012;

    const radius = 165;
    camera.position.x = Math.sin(rotationY) * Math.cos(rotationX) * radius;
    camera.position.y = Math.sin(rotationX) * radius * 0.65 + 18;
    camera.position.z = Math.cos(rotationY) * Math.cos(rotationX) * radius;
    camera.lookAt(0, 0, 0);

    if (galaxyGroup) {
      galaxyGroup.rotation.y += 0.001;
      galaxyGroup.rotation.z = Math.sin(Date.now() * 0.00035) * 0.06;
    }

    if (starPoints) {
      starPoints.rotation.y += 0.00012;
    }

    if (flowerMaterial) {
      flowerMaterial.uniforms.uTime.value = performance.now() * 0.001;
    }

    textSprites.forEach((s, i) => {
      s.material.opacity = 0.75 + Math.sin(Date.now() * 0.0015 + i) * 0.2;
    });

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
